services:
  - type: web
    name: netease-music-toolbox
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:${PORT:-10000} --workers 1 --threads 4 main:app
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_DEPLOYMENT
        value: "1"
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
