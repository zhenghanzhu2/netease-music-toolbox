<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐工具箱 · 轻松频率内部专用</title>
    <link href="/static/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/APlayer.min.css">
    <style>
        :root {
            --ink:#203b36; --muted:#71847f; --mint:#55bfae; --mint-dark:#247f73;
            --mint-pale:#e9f6f2; --paper:#fff; --line:#e3eeeb;
        }
        * { box-sizing:border-box; }
        body {
            min-height:100vh; color:var(--ink);
            background:linear-gradient(145deg,#eff8f5 0%,#f7faf9 42%,#edf6f3 100%);
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
            letter-spacing:0;
        }
        button,input,select,textarea { font:inherit; }
        body > .container {
            display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:22px 24px;
            width:100%; max-width:1120px; margin:0 auto; padding:36px 28px 40px;
            align-content:start;
        }
         .brand-lockup { position:relative;
            grid-column:1/-1; display:grid; grid-template-columns:minmax(0,1fr);
            grid-template-rows:auto auto; gap:14px; margin:0!important; padding:0 0 22px;
            min-height:0; border-bottom:1px solid #e3eeeb;
        }
        .brand-left { grid-column:1; grid-row:1; display:flex; align-items:center; justify-self:start; min-width:0; }
        .brand-logo-frame {
            flex:0 0 auto; width:184px; overflow:hidden; border-radius:0;
            background:transparent; border:0; box-shadow:none;
        }
        .brand-logo { display:block; width:100%; height:auto; mix-blend-mode:multiply; }
        .brand-copy { grid-column:1/-1; grid-row:2; display:flex; flex-direction:column; align-items:center; gap:10px; min-width:0; text-align:center; }
        .brand-title-row { display:flex; align-items:center; justify-content:center; }
        .brand-copy h1 {
            margin:0!important; color:var(--ink); font-size:34px; font-weight:680;
            letter-spacing:0; line-height:1.25; white-space:nowrap;
        }
        .brand-tag {
            position:absolute; top:8px; right:0; display:inline-flex; align-items:center; padding:0; border:0;
            border-radius:0; color:#67cabb; background:transparent;
            font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
            font-size:20px; font-weight:400; line-height:1.2; letter-spacing:0;
            white-space:nowrap;
        }
        .brand-tag:before { content:none; }
        .brand-tag:before { content:none; }
        .brand-subtitle { margin:0!important; color:var(--muted); font-size:16px; line-height:1.6; text-align:center; }
        body > .container > .card { min-width:0; margin:0!important; border:1px solid #e8f0ed; border-radius:16px; background:var(--paper); box-shadow:0 8px 24px #1c66560a!important; overflow:hidden; }
        body > .container > .card.shadow-sm { grid-column:1; }
        body > .container > .card.mt-3 { grid-column:2; align-self:stretch; display:flex; align-items:center; }
        body > .container > .card.mt-3 > .card-body { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; min-height:402px; }
        .card.shadow-sm > .card-body { min-height:402px; padding:34px; display:flex; align-items:center; }
        #main-form { width:100%; }
        #main-form .mb-3 { margin-bottom:16px!important; }
        .form-label { display:block; color:#4e6c65; font-size:13px; font-weight:600; margin-bottom:7px; }
        .form-control,.form-select {
            min-height:45px; border:1px solid #dce8e4; border-radius:9px;
            color:var(--ink); background-color:#fff; box-shadow:none;
        }
        .form-control::placeholder { color:#9aa9a5; }
        .form-control:focus,.form-select:focus { border-color:#72c7b8; box-shadow:0 0 0 3px #45ad9d1a; }
        #search-area { display:grid; grid-template-columns:minmax(0,1fr) 120px; gap:0 14px; align-items:end; }
        #search-area .text-center { grid-column:1/-1; text-align:left!important; }
        .btn {
            min-height:42px; padding:9px 18px; border-radius:9px; font-weight:600;
            transition:transform .16s,box-shadow .16s,background-color .16s;
        }
        .btn:hover { transform:translateY(-1px); }
        .btn-primary,.btn-success {
            color:#fff; background:#35a997; border:0; box-shadow:0 4px 10px #238f8117;
        }
        .btn-primary:hover,.btn-success:hover { color:#fff; background:#278f80; }
        .btn-warning { color:#39776d; background:#eaf6f2; border:1px solid #d2eae3; }
        .btn-info { color:#fff; background:#559f94; border:0; }
        #main-form .text-center { text-align:center!important; }
        #main-form .text-center .btn { width:min(100%,180px)!important; margin:8px auto 0; display:block; }
        #login-start { color:#27877b; border:1px solid #a9d9d0; background:#f4fbf8; }
        #login-start:hover { color:#176e64; background:#e5f5f0; }
        #login-message { max-width:230px; margin:11px auto 2px!important; color:var(--muted); font-size:12px; line-height:1.65; }
        #login-qr { padding:9px; border:1px solid var(--line); border-radius:12px; margin-top:14px; }
        body > .container > #search-result, body > .container > #song-info,
        body > .container > #playlist-result, body > .container > #album-result {
            grid-column:1/-1; min-width:0; width:100%; margin-top:2px!important;
        }
        #search-result h5 { color:#2c766b; font-size:16px; font-weight:650; margin:6px 0 11px; }
        .list-group { border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 4px 14px #1c665608; }
        .list-group-item { min-width:0; padding:12px 14px; border-color:var(--line); background:#fff; }
        .list-group-item:hover { background:#f5fbf9; }
        .song-title,.playlist-title { display:inline-block; max-width:220px; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .list-group-item .select-song { flex-shrink:0; margin-left:10px; }
        #song-info { border-radius:15px!important; }
        #song-info img { max-width:100%; border-radius:8px; }
        #song-info .badge.bg-primary,#song-info .badge.bg-success { background:#389f91!important; color:#fff!important; }
        #song-info .badge.bg-secondary,#song-info .badge.bg-dark { background:#e9f3f0!important; color:#49655f!important; }
        #song-info .badge.bg-info { background:#d9f1eb!important; color:#347c72!important; }
        #song-info .badge.bg-warning { background:#f2ebd6!important; color:#6c592d!important; }
        .alert-info { background:#edf8f5; color:#355d55; border-color:#d7eee8; }
        .lyric-box { max-height:230px; overflow-y:auto; background:#f7fcfa; border:1px solid #e1f1ed; border-radius:10px; padding:13px 15px; font-size:14px; color:#36564f; line-height:1.8; }
        .progress { height:8px; border-radius:99px; background:#e5f2ef; }
        .progress-bar { background:linear-gradient(90deg,#46b7a7,#88d8ca); }
        .footer { color:var(--muted)!important; background:transparent!important; border-color:#dcebe7!important; }
        ::selection { color:#184c45; background:#c8eee5; }
        @media(max-width:760px) {
            body > .container { display:block; width:100%; max-width:100%; padding:22px 18px 26px; }
            .brand-lockup { flex-direction:column; gap:11px; margin-bottom:14px!important; align-items:center; text-align:center; }
            .brand-logo-frame { width:min(180px,64vw); }
            .brand-copy { align-items:center; gap:6px; }
            .brand-title-row { justify-content:center; gap:8px; }
            .brand-copy h1 { font-size:clamp(22px,5.6vw,27px); text-align:center; white-space:normal; }
            .brand-subtitle { text-align:center; }
            body > .container > .card { margin-top:13px!important; }
            .card.shadow-sm > .card-body { min-height:0; padding:22px 20px; display:block; }
            body > .container > .card.mt-3 > .card-body { min-height:220px; padding:24px 20px; }
            #search-area { display:grid; grid-template-columns:minmax(0,1fr) 140px; gap:0 16px; align-items:end; }
            #search-area .text-center { grid-column:1/-1; text-align:center!important; }
            #main-form .text-center .btn { width:min(100%,180px)!important; }
            body > .container > #search-result, body > .container > #song-info,
            body > .container > #playlist-result, body > .container > #album-result { margin-top:17px!important; }
            .song-title,.playlist-title { max-width:130px; }
        }
        @media(max-width:420px) {
            body > .container { padding-left:13px; padding-right:13px; }
            #main-form .card-body { padding:18px 15px; }
            .brand-copy h1 { font-size:22px; }
            .brand-tag { position:static; font-size:11px; }
        }
    </style>
    <style>
        /* Desktop layout: give the tool a roomier, more balanced vertical rhythm. */
        body { display:flex; flex-direction:column; }
        body > .container {
            flex:1 0 auto; width:100%; max-width:1320px;
            margin:0 auto!important; padding:42px 36px 34px;
            grid-template-columns:minmax(0,1fr) 360px; gap:28px 30px;
        }
        .brand-lockup { gap:22px; padding-bottom:30px; }
        .brand-logo-frame { width:196px; }
        .brand-copy { gap:13px; }
        .brand-copy h1 { font-size:38px; }
        .brand-subtitle { font-size:18px; }
        body > .container > .card.mt-3 > .card-body {
            min-height:500px; padding:40px 30px;
        }
        .card.shadow-sm > .card-body {
            min-height:500px; padding:48px 44px;
            display:flex; align-items:center; justify-content:center;
        }
        #main-form { width:100%; max-width:820px; }
        #main-form .mb-3 { margin-bottom:22px!important; }
        .form-label { font-size:15px; margin-bottom:10px; }
        .form-control,.form-select { min-height:58px; border-radius:12px; font-size:17px; }
        #search-area { grid-template-columns:minmax(0,1fr) 150px; gap:0 20px; }
        #main-form .text-center .btn { width:min(100%,210px)!important; min-height:52px; margin-top:10px; }
        #login-start { min-height:50px; padding:11px 24px; font-size:16px; }
        #login-message { max-width:270px; font-size:14px; line-height:1.8; }
        #login-qr { width:240px; height:240px; }
        .footer { margin-top:18px!important; }
        @media(max-width:760px) {
            body { display:block; }
            body > .container {
                display:block; width:100%; max-width:100%; padding:22px 18px 26px;
            }
            .brand-lockup { gap:11px; padding-bottom:18px; }
            .brand-logo-frame { width:min(180px,64vw); }
            .brand-copy { gap:6px; }
            .brand-copy h1 { font-size:clamp(24px,5.6vw,30px); }
            .brand-subtitle { font-size:16px; }
            .card.shadow-sm > .card-body { min-height:0; padding:22px 20px; display:block; }
            body > .container > .card.mt-3 > .card-body { min-height:0; padding:24px 20px; }
            #main-form .mb-3 { margin-bottom:16px!important; }
            .form-control,.form-select { min-height:48px; font-size:16px; }
            .form-label { font-size:14px; margin-bottom:7px; }
            #search-area { grid-template-columns:minmax(0,1fr) 140px; gap:0 16px; }
            #main-form .text-center .btn { width:min(100%,180px)!important; min-height:46px; }
            #login-message { font-size:12px; }
            #login-qr { width:220px; height:220px; }
            .footer { margin-top:24px!important; }
        }
        @media(max-width:420px) {
            body > .container { padding-left:13px; padding-right:13px; }
            .brand-copy h1 { font-size:22px; }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <header class="brand-lockup mb-4" aria-label="网易云音乐工具箱，轻松频率内部专用">
            <div class="brand-left">
                <div class="brand-logo-frame"><img class="brand-logo" src="/static/qingsong-frequency-logo.png" alt="轻松频率"></div>
                <div class="brand-tag">轻松频率内部专用</div>
            </div>
            <div class="brand-copy">
                <div class="brand-title-row"><h1>网易云音乐工具箱</h1></div>
                <p class="brand-subtitle">搜索、解析与下载，轻松管理你的音乐</p>
            </div>
        </header>
        <div class="card shadow-sm">
            <div class="card-body">
                <form id="main-form">
                    <div class="mb-3">
                        <label class="form-label">功能选择</label>
                        <select id="mode-select" class="form-select">
                            <option value="search">歌曲搜索</option>
                            <option value="parse">单曲解析</option>
                            <option value="playlist">歌单解析</option>
                            <option value="album">专辑解析</option>
                            <option value="download">音乐下载</option>
                        </select>
                    </div>
                    <div id="search-area">
                        <div class="mb-3">
                            <label for="search_keywords" class="form-label">搜索关键词</label>
                            <input type="text" id="search_keywords" class="form-control" placeholder="输入关键词进行搜索">
                        </div>
                        <div class="mb-3">
                            <label for="search_limit" class="form-label">返回数量</label>
                            <input type="number" id="search_limit" class="form-control" value="10" min="1" max="50">
                        </div>
                        <div class="text-center">
                            <button type="button" id="search-btn" class="btn btn-success">搜索</button>
                        </div>
                    </div>
                    <div id="parse-area" style="display:none;">
                        <div class="mb-3">
                            <label for="song_ids" class="form-label">歌曲ID或URL</label>
                            <input type="text" id="song_ids" class="form-control" placeholder="输入歌曲ID或URL">
                        </div>
                        <div class="mb-3">
                            <label for="level" class="form-label">音质选择</label>
                            <select id="level" class="form-select">
                                <option value="standard">标准音质</option>
                                <option value="exhigh">极高音质</option>
                                <option value="lossless">无损音质</option>
                                <option value="hires">Hires音质</option>
                                <option value="sky">沉浸环绕声</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带</option>
                                <option value="dolby">杜比全景声</option>
                            </select>
                        </div>
                        <div class="text-center">
                            <button type="button" id="parse-btn" class="btn btn-primary">解析</button>
                        </div>
                    </div>
                    <div id="playlist-area" style="display:none;">
                        <div class="mb-3">
                            <label for="playlist_id" class="form-label">歌单ID或链接</label>
                            <input type="text" id="playlist_id" class="form-control" placeholder="输入歌单ID或网易云歌单链接">
                        </div>
                        <div class="text-center">
                            <button type="button" id="playlist-btn" class="btn btn-warning">解析歌单</button>
                        </div>
                    </div>
                    <div id="album-area" style="display:none;">
                        <div class="mb-3">
                            <label for="album_id" class="form-label">专辑ID或链接</label>
                            <input type="text" id="album_id" class="form-control" placeholder="输入专辑ID或网易云专辑链接">
                        </div>
                        <div class="text-center">
                            <button type="button" id="album-btn" class="btn btn-info">解析专辑</button>
                        </div>
                    </div>
                    <div id="download-area" style="display:none;">
                        <div class="mb-3">
                            <label for="download_id" class="form-label">音乐ID或URL</label>
                            <input type="text" id="download_id" class="form-control" placeholder="输入音乐ID或网易云音乐链接">
                        </div>
                        <div class="mb-3">
                            <label for="download_quality" class="form-label">下载音质</label>
                            <select id="download_quality" class="form-select">
                                <option value="standard">标准音质</option>
                                <option value="exhigh">极高音质</option>
                                <option value="lossless" selected>无损音质</option>
                                <option value="hires">Hires音质</option>
                                <option value="sky">沉浸环绕声</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带</option>
                                <option value="dolby">杜比全景声</option>
                            </select>
                        </div>
                        <div class="text-center">
                            <button type="button" id="download-btn" class="btn btn-success">下载音乐</button>
                        </div>
                        <div id="download-progress" class="mt-3 d-none">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                            </div>
                            <div class="text-center mt-2">
                                <small class="text-muted">正在下载并写入元信息...</small>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mt-3"><div class="card-body text-center">
          <button id="login-start" type="button" class="btn btn-outline-primary">网易云扫码登录</button>
          <p id="login-message" class="mt-2 mb-1">需要账号权限时，可用网易云音乐手机 App 扫码登录。</p>
          <img id="login-qr" alt="网易云登录二维码" style="display:none;width:220px;height:220px;background:white">
        </div></div>
        <!-- 搜索结果列表 -->
        <div id="search-result" class="mt-4 d-none">
            <h5>搜索结果：</h5>
            <ul class="list-group" id="search-list"></ul>
        </div>
        <!-- 结果展示区域 -->
        <div id="song-info" class="alert alert-info d-none mt-4 p-0 border-0" style="box-shadow:0 2px 8px rgba(0,0,0,0.07);">
            <div class="row g-0 align-items-stretch">
                <div class="col-md-8 p-3 d-flex flex-column justify-content-between">
                    <h4 class="mb-2" id="song_name" style="font-weight:700;"></h4>
                    <div class="mb-2"><span class="badge bg-primary me-2">歌手</span><span id="artist_names"></span></div>
                    <div class="mb-2"><span class="badge bg-secondary me-2">专辑</span><span id="song_alname"></span></div>
                    <div class="mb-2"><span class="badge bg-success me-2">音质</span><span id="song_level"></span></div>
                    <div class="mb-2"><span class="badge bg-warning text-dark me-2">大小</span><span id="song_size"></span></div>
                    <div class="mb-2">
                        <button id="show-big-pic" type="button" class="btn btn-outline-info btn-sm me-2" style="vertical-align:middle;">显示大图</button>
                    </div>
                    <div class="mb-2"><span class="badge bg-info text-dark me-2">链接</span><a id="song_url" href="" target="_blank">点击下载</a></div>
                    <div class="mb-2"><span class="badge bg-dark me-2">歌词</span></div>
                    <div class="lyric-box" id="lyric"></div>
                </div>
            </div>
            <div class="row g-0">
                <div class="col-12 p-3 pt-0">
                    <div id="aplayer"></div>
                </div>
            </div>
        </div>
        <!-- 歌单解析结果 -->
        <div id="playlist-result" class="mt-4 d-none">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <img id="playlist-cover" src="" alt="cover" style="width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:15px;">
                        <div>
                            <h5 id="playlist-name" class="mb-1"></h5>
                            <div class="text-muted" id="playlist-creator"></div>
                        </div>
                    </div>
                    <div id="playlist-desc" class="mb-2 text-secondary small"></div>
                    <div>共 <span id="playlist-count"></span> 首歌</div>
                </div>
            </div>
            <ul class="list-group mt-3" id="playlist-tracks"></ul>
        </div>
        <!-- 专辑解析结果 -->
        <div id="album-result" class="mt-4 d-none">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <img id="album-cover" src="" alt="cover" style="width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:15px;">
                        <div>
                            <h5 id="album-name" class="mb-1"></h5>
                            <div class="text-muted" id="album-artist"></div>
                        </div>
                    </div>
                    <div id="album-desc" class="mb-2 text-secondary small"></div>
                    <div>共 <span id="album-count"></span> 首歌</div>
                </div>
            </div>
            <ul class="list-group mt-3" id="album-tracks"></ul>
        </div>
    </div>
    <!-- Modal for big picture -->
    <div class="modal fade" id="bigPicModal" tabindex="-1" aria-labelledby="bigPicModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bigPicModalLabel">大图预览</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="big-pic-img" src="" alt="大图" style="max-width:100%;max-height:60vh;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.12);">
                </div>
            </div>
        </div>
    </div>
    <footer class="footer mt-5 py-3 bg-light border-top">
        <div class="container text-center text-muted small">
            <span>网易云音乐工具箱 &copy; 2026 | Powered by Zhenghan Zhu | <a href="https://github.com/zhenghanzhu2/netease-music-toolbox" target="_blank" rel="noopener">GitHub</a></span>
        </div>
    </footer>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            let loginTimer;
            $('#login-start').on('click', async function() {
                clearInterval(loginTimer);
                $('#login-message').text('正在生成二维码…');
                try {
                    const response = await fetch('/local-login/start', {method:'POST'});
                    if (!response.ok) throw new Error();
                    const blob = await response.blob();
                    $('#login-qr').attr('src', URL.createObjectURL(blob)).show();
                    $('#login-message').text('请使用网易云音乐手机 App 扫码，并在手机上确认登录。');
                    loginTimer = setInterval(async () => {
                        try {
                            const r = await fetch('/local-login/status', {method:'POST'});
                            const result = await r.json();
                            const state = result.data && result.data.state;
                            if (state === 'success') { clearInterval(loginTimer); $('#login-qr').hide(); $('#login-message').text('登录成功，账号信息已保存在这台电脑。'); }
                            else if (state === 'scanned') $('#login-message').text('已扫码，请在手机上确认登录。');
                            else if (state === 'expired' || state === 'error') { clearInterval(loginTimer); $('#login-message').text('二维码失效，请重新点击扫码登录。'); }
                        } catch(e) { clearInterval(loginTimer); $('#login-message').text('检查登录状态失败，请重试。'); }
                    }, 3000);
                } catch(e) { $('#login-message').text('二维码生成失败，请重试。'); }
            });

            function lrctrim(lyrics) {
                const lines = lyrics.split('\n');
                const data = [];

                lines.forEach((line, index) => {
                    const matches = line.match(/\[(\d{2}):(\d{2}[\.:]?\d*)]/);
                    if (matches) {
                        const minutes = parseInt(matches[1], 10);
                        const seconds = parseFloat(matches[2].replace('.', ':')) || 0;
                        const timestamp = minutes * 60000 + seconds * 1000;

                        let text = line.replace(/\[\d{2}:\d{2}[\.:]?\d*\]/g, '').trim();
                        text = text.replace(/\s\s+/g, ' '); // Replace multiple spaces with a single space

                        data.push([timestamp, index, text]);
                    }
                });

                data.sort((a, b) => a[0] - b[0]);

                return data;
            }

            function lrctran(lyric, tlyric) {
                lyric = lrctrim(lyric);
                tlyric = lrctrim(tlyric);

                let len1 = lyric.length;
                let len2 = tlyric.length;
                let result = "";

                for (let i = 0, j = 0; i < len1 && j < len2; i++) {
                    while (lyric[i][0] > tlyric[j][0] && j + 1 < len2) {
                        j++;
                    }

                    if (lyric[i][0] === tlyric[j][0]) {
                        tlyric[j][2] = tlyric[j][2].replace('/', '');
                        if (tlyric[j][2]) {
                            lyric[i][2] += ` (翻译：${tlyric[j][2]})`;
                        }
                        j++;
                    }
                }

                for (let i = 0; i < len1; i++) {
                    let t = lyric[i][0];
                    result += `[${String(Math.floor(t / 60000)).padStart(2, '0')}:${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')}.${String(t % 1000).padStart(3, '0')}]${lyric[i][2]}\n`;
                }

                return result;
            }

            function extractLinks(text) {
                var regex = /https?:\/\/\S+/g;
                var matches = text.match(regex);
                if (matches) {
                    return matches[0];
                } else {
                    return '';
                }
            }
    
            function checkValidLink(link) {
                if (link.indexOf("http") === -1 || 
                    (link.indexOf("music.163.com") === -1 && link.indexOf("163cn.tv") === -1)) {
                    return false;
                }
                return true;
            }
    
            function extractAndCheckId(text) {
                var link = extractLinks(text);
                if (checkValidLink(link)) {
                    return link;
                } else {
                    var idRegex = /\b\d+\b/g;
                    var ids = text.match(idRegex);
                    if (ids && ids.length > 0) {
                        return ids[0];
                    }
                    return '';
                }
            }

            // 切换功能区
            $('#mode-select').on('change', function() {
                if ($(this).val() === 'search') {
                    $('#search-area').show();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'parse') {
                    $('#search-area').hide();
                    $('#parse-area').show();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'playlist') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').show();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'album') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').show();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'download') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').show();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else {
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#album-result').addClass('d-none');
                }
            });

            // 搜索功能
            $('#search-btn').on('click', function() {
                const keywords = $('#search_keywords').val();
                const limit = $('#search_limit').val();
                if (!keywords) {
                    alert('请输入搜索关键词');
                    return;
                }
                $.ajax({
                    url: '/Search',
                    method: 'POST',
                    data: { keyword: keywords, limit: limit },
                    dataType: 'json',
                    success: function(data) {
                        if (data.status === 200) {
                            $('#search-list').empty();
                            data.data.forEach(function(song) {
                                const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <img src="${song.picUrl}" alt="cover" style="width:40px;height:40px;object-fit:cover;border-radius:4px;margin-right:10px;">
                                        <strong class='song-title'>${song.name}</strong> - <span>${song.artists}</span> <span class="text-muted">[${song.album}]</span>
                                    </div>
                                    <div>
                                        <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}">解析</button>
                                        <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}">下载</button>
                                    </div>
                                </li>`;
                                $('#search-list').append(item);
                            });
                            $('#search-result').removeClass('d-none');
                        } else {
                            $('#search-list').html('<li class="list-group-item">未找到相关歌曲</li>');
                            $('#search-result').removeClass('d-none');
                        }
                    },
                    error: function() {
                        $('#search-list').html('<li class="list-group-item">搜索失败，请重试</li>');
                        $('#search-result').removeClass('d-none');
                    }
                });
            });

            // 搜索结果点击解析
            $(document).on('click', '.select-song', function() {
                const songId = $(this).data('id');
                $('#song_ids').val(songId);
                $('#mode-select').val('parse').trigger('change');
                $('html,body').animate({scrollTop: $('#main-form').offset().top}, 300);
            });

            // 单曲解析
            $('#parse-btn').on('click', function() {
                const songIds = $('#song_ids').val();
                const level = $('#level').val();
                if (!songIds) {
                    alert('请输入歌曲ID或URL');
                    return;
                }
                $.post('/Song_V1', { url: songIds, level: level, type:'json' }, function(data) {
                    if (data.status === 200) {
                        $('#song_name').text(data.data.name);
                        $('#artist_names').text(data.data.ar_name);
                        $('#song_alname').text(data.data.al_name);
                        $('#song_level').text(data.data.level);
                        $('#song_size').text(data.data.size);
                        let processedLyrics = data.data.lyric;
                        if (data.data.tlyric) {
                            processedLyrics = lrctran(data.data.lyric, data.data.tlyric);
                        }
                        $('#lyric').html(processedLyrics.replace(/\n/g, '<br>'));
                        $('#song_url').attr('href', data.data.url).text('点击下载');
                        $('#song-info').removeClass('d-none');
                        $('#show-big-pic').data('pic', data.data.pic);
                        new APlayer({
                            container: document.getElementById('aplayer'),
                            lrcType: 1,
                            audio: [{
                                name: data.data.name,
                                artist: data.data.ar_name,
                                url: data.data.url,
                                cover: data.data.pic,
                                lrc: processedLyrics
                            }]
                        });
                    } else {
                        alert(data.data.msg);
                    }
                }, 'json');
            });

            // 显示大图按钮事件
            $(document).on('click', '#show-big-pic', function() {
                var picUrl = $(this).data('pic');
                $('#big-pic-img').attr('src', picUrl);
                var modal = new bootstrap.Modal(document.getElementById('bigPicModal'));
                modal.show();
            });

            // 歌单解析
            $('#playlist-btn').on('click', function() {
                let pid = $('#playlist_id').val().trim();
                if (!pid) {
                    alert('请输入歌单ID或链接');
                    return;
                }
                // 支持直接粘贴歌单链接
                const idMatch = pid.match(/playlist\?id=(\d+)/);
                if (idMatch) pid = idMatch[1];
                $.get('/Playlist', { id: pid }, function(data) {
                    if (data.status === 200) {
                        const pl = data.data.playlist;
                        $('#playlist-cover').attr('src', pl.coverImgUrl);
                        $('#playlist-name').text(pl.name);
                        $('#playlist-creator').text('by ' + pl.creator);
                        $('#playlist-desc').text(pl.description || '');
                        $('#playlist-count').text(pl.trackCount);
                        $('#playlist-tracks').empty();
                        pl.tracks.forEach(function(song, idx) {
                            const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <img src="${song.picUrl}" alt="cover" style="width:32px;height:32px;object-fit:cover;border-radius:4px;margin-right:8px;">
                                    <strong class="playlist-title">${idx+1}. ${song.name}</strong> - <span>${song.artists}</span> <span class="text-muted">[${song.album}]</span>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}">解析</button>
                                    <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}">下载</button>
                                </div>
                            </li>`;
                            $('#playlist-tracks').append(item);
                        });
                        $('#playlist-result').removeClass('d-none');
                    } else {
                        $('#playlist-result').removeClass('d-none');
                        $('#playlist-tracks').html('<li class="list-group-item">歌单解析失败：'+data.data.msg+'</li>');
                    }
                }, 'json');
            });

            // 专辑解析
            $(document).on('click', '#album-btn', function() {
                let aid = $('#album_id').val().trim();
                if (!aid) {
                    alert('请输入专辑ID或链接');
                    return;
                }
                // 支持直接粘贴专辑链接
                const idMatch = aid.match(/album\?id=(\d+)/);
                if (idMatch) aid = idMatch[1];
                $.get('/Album', { id: aid }, function(data) {
                    if (data.status === 200) {
                        const al = data.data.album;
                        $('#album-cover').attr('src', al.coverImgUrl);
                        $('#album-name').text(al.name);
                        $('#album-artist').text(al.artist);
                        $('#album-desc').text(al.description || '');
                        $('#album-count').text(al.songs.length);
                        $('#album-tracks').empty();
                        al.songs.forEach(function(song, idx) {
                            const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <img src="${song.picUrl}" alt="cover" style="width:32px;height:32px;object-fit:cover;border-radius:4px;margin-right:8px;">
                                    <strong class="playlist-title">${idx+1}. ${song.name}</strong> - <span>${song.artists}</span> <span class="text-muted">[${song.album}]</span>
                                </div>
                                <div>
                                    <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}">解析</button>
                                    <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}">下载</button>
                                </div>
                            </li>`;
                            $('#album-tracks').append(item);
                        });
                        $('#album-result').removeClass('d-none');
                    } else {
                        $('#album-result').removeClass('d-none');
                        $('#album-tracks').html('<li class="list-group-item">专辑解析失败：'+data.data.msg+'</li>');
                    }
                }, 'json');
            });

            // 音乐下载功能
            $('#download-btn').on('click', function() {
                const musicId = $('#download_id').val().trim();
                const quality = $('#download_quality').val();
                
                if (!musicId) {
                    alert('请输入音乐ID或URL');
                    return;
                }
                
                // 提取ID（支持URL格式）
                let processedId = musicId;
                const idMatch = musicId.match(/song\?id=(\d+)/);
                if (idMatch) {
                    processedId = idMatch[1];
                }
                
                // 显示进度条
                $('#download-progress').removeClass('d-none');
                $('#download-btn').prop('disabled', true).text('下载中...');
                
                // 使用XMLHttpRequest来处理下载并获取响应头
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/Download', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.responseType = 'blob';
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        // 获取自定义响应头
                        const downloadMessage = xhr.getResponseHeader('X-Download-Message');
                        const encodedFilename = xhr.getResponseHeader('X-Download-Filename');
                        const filename = encodedFilename ? decodeURIComponent(encodedFilename) : 'music.flac';
                        
                        // 创建下载链接
                        const blob = xhr.response;
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename || 'music.flac';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        // 显示完成提示
                        alert('✅ 音乐文件下载完成！');
                        console.log(`下载完成: ${filename}`);
                        if (downloadMessage) {
                            console.log(`服务器消息: ${downloadMessage}`);
                        }
                    } else {
                        alert('下载失败，请重试');
                    }
                    
                    // 重置按钮状态
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).text('下载音乐');
                };
                
                xhr.onerror = function() {
                    alert('下载出错，请重试');
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).text('下载音乐');
                };
                
                // 发送请求
                const formData = `id=${encodeURIComponent(processedId)}&quality=${encodeURIComponent(quality)}`;
                xhr.send(formData);
            });

            // 列表中的下载按钮点击事件
            // 下载按钮点击跳转到下载功能
            $(document).on('click', '.download-song', function() {
                const musicId = $(this).data('id');
                const songName = $(this).data('name');
                
                if (!musicId) {
                    alert('无法获取音乐ID');
                    return;
                }
                
                // 填充下载ID并跳转到下载功能区域
                $('#download_id').val(musicId);
                $('#mode-select').val('download').trigger('change');
                $('html,body').animate({scrollTop: $('#main-form').offset().top}, 300);
            });
        });
    </script>
</body>
